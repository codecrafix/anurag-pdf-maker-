name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Copy PDF libraries into www/lib (offline use)
        run: npm run libs
      - name: Add Android platform
        run: npx cap add android
      - name: Patch AndroidManifest (AdMob App ID + camera)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: python3 scripts/patch-manifest.py
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anurag-pdf-maker-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
